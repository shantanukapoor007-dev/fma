plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fma.fieldmaintenance'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fma.fieldmaintenance'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the bundled fonts uncompressed-safe and never strip web assets
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
